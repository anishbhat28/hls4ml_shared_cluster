apiVersion: batch/v1
kind: Job
metadata:
  name: rw-g-jet-r4-p16-lat-c5-s2
  namespace: hls4ml-nrp
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        topology.kubernetes.io/region: us-west
      containers:
      - name: build
        image: gitlab-registry.nrp-nautilus.io/nrp/coder-images/vivado-vitis
        env:
        - {name: NAME,   value: "rw-g-jet-r4-p16-lat-c5"}
        - {name: MODEL,  value: "jet"}
        - {name: RF,     value: "4"}
        - {name: PREC,   value: "ap_fixed<16,6>"}
        - {name: STRAT,  value: "Latency"}
        - {name: CLK,    value: "5.0"}
        - {name: MEM_REQUEST, value: "40Gi"}
        - {name: CPU_REQUEST, value: "8"}
        - {name: KERNEL_SLR, value: "SLR2"}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        command: ["/bin/bash","-c"]
        args:
        - |
          set -eo pipefail
          OUT=/work/rw/builds/$NAME
          # wait until stage 1 of this design has finished (so both stages can be submitted at once)
          echo "waiting for stage 1 of $NAME"
          for i in $(seq 1 480); do
            grep -q ',done$' $OUT/stages.csv 2>/dev/null && break
            if grep -q ',exit$' $OUT/stages.csv 2>/dev/null && ! grep -q ',done$' $OUT/stages.csv; then echo "stage 1 failed"; exit 1; fi
            sleep 60
          done
          grep -q ',done$' $OUT/stages.csv || { echo "stage 1 not finished after 8 h"; exit 1; }
          echo "stage 1 done $(date)"
          mkdir -p $OUT
          env | grep -E '^(NAME|MODEL|RF|PREC|STRAT|CLK|MEM_REQUEST|CPU_REQUEST|KERNEL_SLR|NODE_NAME)=' | sort > $OUT/config_link.txt
          lscpu 2>/dev/null | grep -E 'Model name|^CPU\(s\)|MHz' >> $OUT/config_link.txt || true
          cat $OUT/config_link.txt

          # ---- logging: stage times + memory every 15 s ----
          echo init > /tmp/stage
          stage() { echo "$1" > /tmp/stage; echo "$(date +%s),$1" >> $OUT/stages_link.csv; echo "##### STAGE $1 $(date)"; }
          echo "unix_time,stage,mem_current_bytes,mem_anon_bytes,cpu_usage_usec" > $OUT/mem_link.csv
          ( while true; do
              cur=$(cat /sys/fs/cgroup/memory.current 2>/dev/null || cat /sys/fs/cgroup/memory/memory.usage_in_bytes)
              anon=$(awk '$1=="anon"{print $2}' /sys/fs/cgroup/memory.stat 2>/dev/null || echo NA)
              cpu=$(awk '$1=="usage_usec"{print $2}' /sys/fs/cgroup/cpu.stat 2>/dev/null || echo NA)
              echo "$(date +%s),$(cat /tmp/stage),$cur,$anon,$cpu" >> $OUT/mem_link.csv
              sleep 15
            done ) &
          trap 'echo "$(date +%s),exit" >> $OUT/stages_link.csv; cat /sys/fs/cgroup/memory.peak > $OUT/peak_link_bytes.txt 2>/dev/null || true' EXIT

          # ---- tools ----
          export XILINXD_LICENSE_FILE=2100@xilinxd.xilinx-dev
          export PLATFORM_REPO_PATHS=/opt/xilinx/platforms
          source /opt/xilinx/xrt/setup.sh
          source /tools/Xilinx/Vitis/2024.2/settings64.sh
          [ -f /work/fakelib/libudev.so.1 ] && export LD_LIBRARY_PATH=/work/fakelib:$LD_LIBRARY_PATH
          stage unpack
          tar xzf /work/rw/bundles/$NAME.tgz -C /scratch
          export LINKDIR=/scratch/prj/vitis_workspace/system_link
          cat $OUT/gate.json
          # ---- 4. link (only the v++ line, so the power report isn't counted in the link cost) ----
          stage link
          cd $LINKDIR
          VPP="$(grep '^v++ -l' link_system.sh)"
          echo "RUN: $VPP"
          eval "$VPP"

          # ---- 5. collect ----
          stage collect
          cp myproject.xclbin $OUT/
          xclbinutil --info --input myproject.xclbin > $OUT/xclbin_info.txt || true
          cp _x/reports/link/imp/*timing_summary*routed*.rpt $OUT/ 2>/dev/null || true
          cp _x/reports/link/imp/*full_util_routed*.rpt     $OUT/ 2>/dev/null || true
          grep -h -E "(synth_design|opt_design|place_design|phys_opt_design|route_design|write_bitstream): Time \(s\)" \
            _x/link/vivado/vpl/prj/prj.runs/*/runme.log > $OUT/vivado_steps.txt 2>/dev/null || true
          du -sb /scratch/prj > $OUT/disk_bytes_before_cleanup.txt
          # keep the small generated sources + HLS reports on the PVC; the big Vivado tree stays on node-local scratch
          tar --exclude='_x' --exclude='.ipcache' --exclude='*.xclbin' --exclude='*.xo' -czf $OUT/prj_sources.tgz -C /scratch prj || true
          rm -rf $LINKDIR/_x $LINKDIR/.ipcache
          stage done
          echo "########## RESULT $NAME node=$NODE_NAME ##########"
          cat $OUT/stages_link.csv
          echo "disk_bytes_before_cleanup $(cut -f1 $OUT/disk_bytes_before_cleanup.txt)"
          echo "memory_peak_bytes $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo NA)"
          cat $OUT/hls_fmax.txt
          grep -h -A3 -E "^\s+WNS\(ns\)" $OUT/*timing_summary*routed*.rpt | head -4 || true
          grep -i -B1 -A1 "frequency" $OUT/xclbin_info.txt | head -8 || true
          echo "########## END ##########"
        resources:
          requests: {cpu: "8", memory: 40Gi, ephemeral-storage: 10Gi}
          limits:   {cpu: "8", memory: 40Gi, ephemeral-storage: 10Gi}
        volumeMounts:
        - {name: work,  mountPath: /work}
        - {name: tools, mountPath: /tools/Xilinx, readOnly: true}
        - {name: scratch, mountPath: /scratch}
      volumes:
      - name: scratch
        emptyDir: {}
      - name: work
        persistentVolumeClaim: {claimName: hls4ml-work}
      - name: tools
        persistentVolumeClaim:
          claimName: xilinx-tools
          readOnly: true
