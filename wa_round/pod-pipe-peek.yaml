# Small pod for reading /work (no FPGA, no tools). Delete when done.
apiVersion: v1
kind: Pod
metadata: {name: pipe-peek, namespace: hls4ml-nrp}
spec:
  restartPolicy: Never
  containers:
  - name: peek
    image: busybox:1.36
    command: ["sh", "-c", "sleep 7200"]
    resources:
      requests: {cpu: "1", memory: 1Gi}
      limits:   {cpu: "1", memory: 1Gi}
    volumeMounts:
    - {name: work, mountPath: /work}
  volumes:
  - name: work
    persistentVolumeClaim: {claimName: hls4ml-work}
