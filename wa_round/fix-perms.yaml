# One-off: give /work/pipe to uid 1000 (folders the first driver run created as root). Delete after.
apiVersion: v1
kind: Pod
metadata: {name: pipe-fixperms, namespace: hls4ml-nrp}
spec:
  restartPolicy: Never
  containers:
  - name: f
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /work/pipe && chown -R 1000:1000 /work/pipe && ls -ln /work/pipe"]
    securityContext: {runAsUser: 0}
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits:   {cpu: 100m, memory: 128Mi}
    volumeMounts:
    - {name: work, mountPath: /work}
  volumes:
  - name: work
    persistentVolumeClaim: {claimName: hls4ml-work}
