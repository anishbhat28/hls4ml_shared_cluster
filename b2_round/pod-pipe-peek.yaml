# Small pod for reading /work (no FPGA, no tools). collect.sh starts and deletes it.
apiVersion: v1
kind: Pod
metadata: {name: pipe-peek}
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 7200
  containers:
  - name: peek
    image: busybox:1.36
    command: ["sh", "-c", "sleep 7200"]
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits:   {cpu: 200m, memory: 512Mi}
    volumeMounts:
    - {name: work, mountPath: /work}
  volumes:
  - name: work
    persistentVolumeClaim: {claimName: hls4ml-work}
