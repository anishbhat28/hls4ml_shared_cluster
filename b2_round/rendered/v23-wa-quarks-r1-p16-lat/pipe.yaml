# Driver for one design: runs s1 (convert+csynth+gate) -> s2 (link) -> s3 (card), one Job at a time.
# Only s3 requests a U55C. Everything lands in /work/pipe/v23-wa-quarks-r1-p16-lat/.
apiVersion: batch/v1
kind: Job
metadata:
  name: pipe-v23-wa-quarks-r1-p16-lat
  labels: {app: hls4ml-pipe, design: v23-wa-quarks-r1-p16-lat}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1209600
  activeDeadlineSeconds: 604800
  template:
    spec:
      serviceAccountName: hls4ml-pipe
      restartPolicy: Never
      # same uid as the vivado-vitis image's coder user, so every stage can write the files the driver creates
      securityContext: {runAsUser: 1000, runAsGroup: 1000}
      containers:
      - name: driver
        image: alpine/k8s:1.30.4
        env:
        - {name: HOME, value: /tmp}
        command: ["/bin/bash", "-c"]
        args:
        - |
          NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace); NAME=v23-wa-quarks-r1-p16-lat; CARD=1; FROM=s1; ONLY="s1"; STOP_ON_RISK=0
          OUT=/work/pipe/$NAME
          [ "$FROM" = s1 ] && [ -z "$ONLY" ] && rm -rf $OUT
          mkdir -p $OUT; rm -f $OUT/result.json
          log() { echo "$(date -u '+%a %H:%M:%S UTC') $*" | tee -a $OUT/pipeline.log; }
          result() { printf '{"design": "%s", "outcome": "%s"%s}\n' "$NAME" "$1" "${2:-}" > $OUT/result.json; log "RESULT $(cat $OUT/result.json)"; }
          run() {  # stage timeout_s
            local s=$1 tmo=$2 job=$NAME-$1 t0 st fl f=/jobs/$1.yaml
            [ "$s" = s1 ] && [ -n "$S1FILE" ] && f=$S1FILE
            kubectl -n $NS delete job $job --ignore-not-found --wait=true >/dev/null
            kubectl -n $NS apply -f $f >/dev/null && log "started $job ($(grep -m1 -o 'memory: [0-9]*Gi' $f))"
            t0=$(date +%s)
            while true; do
              st=$(kubectl -n $NS get job $job -o jsonpath='{.status.succeeded}' 2>/dev/null)
              fl=$(kubectl -n $NS get job $job -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null)
              if [ "$st" = 1 ]; then
                kubectl -n $NS logs job/$job > $OUT/$s.log 2>&1; img; log "$job succeeded ($(( ($(date +%s)-t0)/60 )) min)"; return 0
              fi
              if [ "$fl" = True ]; then
                kubectl -n $NS logs job/$job > $OUT/$s.log 2>&1; img
                { kubectl -n $NS get pod -l job-name=$job -o jsonpath='{.items[0].status.containerStatuses[0].state.terminated.reason}'; echo
                  kubectl -n $NS get job $job -o jsonpath='{.status.conditions[?(@.type=="Failed")].reason}'; echo; } > $OUT/${s}_reason.txt 2>/dev/null
                log "$job FAILED ($(( ($(date +%s)-t0)/60 )) min): $(tr '\n' ' ' < $OUT/${s}_reason.txt)"; return 1
              fi
              if [ $(( $(date +%s) - t0 )) -gt $tmo ]; then log "$job timed out after $tmo s"; return 2; fi
              sleep 60
            done
          }
          img() { echo "$s $(kubectl -n $NS get pod -l job-name=$job -o jsonpath='{.items[0].status.containerStatuses[0].imageID}' 2>/dev/null)" >> $OUT/image_digest.txt; }
          want() { if [ -n "$ONLY" ]; then [ "$ONLY" = "$1" ]; else [[ "$1" > "$FROM" || "$1" = "$FROM" ]]; fi; }
          log "pipeline $NAME from=$FROM only=${ONLY:-none}"

          if want s1; then
            if ! run s1 46000; then
              why=$(grep -o 'OOMKilled' $OUT/s1_reason.txt 2>/dev/null)
              if [ "$why" = OOMKilled ] && [ -f /jobs/s1big.yaml ]; then
                log "s1 OOMKilled -> rerun once at 16 Gi (pre-registered rule)"
                cp /jobs/s1big.yaml /tmp/s1.yaml; S1FILE=/tmp/s1.yaml
                run s1 46000 || { result s1_error; exit 1; }
              else result s1_error; exit 1; fi
            fi
            v=$(grep -o '"verdict": "[A-Z]*' $OUT/gate.json | sed 's/.*"//')
            gate=", \"gate\": $(tr -d '\n' < $OUT/gate.json)"
            log "gate $v"
            if [ "$v" = STOP ]; then result gate_stop "$gate"; exit 0; fi
            if [ "$v" = RISK ] && [ "$STOP_ON_RISK" = 1 ]; then result gate_risk "$gate"; exit 0; fi
          fi
          if want s2; then
            run s2 172800 || { result "$(cat $OUT/link_outcome.txt 2>/dev/null || echo link_error)"; exit 1; }
            [ "$CARD" = 1 ] || result built_no_card
          fi
          if want s3 && [ "$CARD" = 1 ]; then
            run s3 172800 || { result card_error; exit 1; }
            log "RESULT $(tr -d '\n' < $OUT/result.json)"
          fi
          log "pipeline $NAME done"
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits:   {cpu: 100m, memory: 256Mi}
        volumeMounts:
        - {name: jobs, mountPath: /jobs}
        - {name: work, mountPath: /work}
      volumes:
      - name: jobs
        configMap: {name: pipe-v23-wa-quarks-r1-p16-lat-jobs}
      - name: work
        persistentVolumeClaim: {claimName: hls4ml-work}
